# Bliss & Butter — Netlify configuration
#
# Static site. Everything served from site/, which is generated by
# tools/prerender.mjs in CI and committed; the DC sources in src-dc/ never ship.
# No Chromium in this build — see .github/workflows/prerender.yml.

[build]
  publish = "site"
  # No bundler. This only stamps the deploy's real URL into robots.txt and
  # sitemap.xml, which cannot be known until Netlify assigns an address.
  command = "node tools/set-site-url.mjs"

# ── Caching ───────────────────────────────────────────────────────────────
# HTML must revalidate so content edits go live immediately. This also covers
# site/tpl/*.tpl.html and the *-mobile.dc.html templates, which hydrate.js
# fetches at runtime and which must never be served stale against a new page.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Scripts hold the catalog and prices, and bb.css is regenerated with the
# pages — revalidate rather than cache hard, since filenames are unversioned.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images are content-stable and the bulk of the payload; cache them long.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/packaging/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Vendored React and the webfonts are version-pinned by content, so they can be
# cached indefinitely. Fonts additionally need CORS to be usable cross-origin.
# vendor/fonts.css is matched by the /*.css rule above and by this one; the more
# specific path wins, which is what we want for a file that never changes.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# ── Security ──────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
